# The Systems index lists concrete systems, not research-area or affiliation buckets.
# Paper links remain the source of publication status and authorship. An omitted
# affiliation makes no institutional claim. Related research is not a claim that
# separate implementations are components of a single deployed system.
- id: agents-retrieval
  label: Agents & retrieval
  systems:
    - id: autoia
      name: AutoIA
      affiliation: ByteDance
      url: /projects/1_autoia/
      action: Explore
      description: A self-evolving harness in which agent teams organize source data, construct reusable context, memory, and tools, and evolve the external working environment through task feedback.
      links:
        - label: Overview
          url: /projects/1_autoia/
          primary: true
        - label: Related memory research · AdaMM
          url: /publications/#Arxiv-26-3
    - id: ubase
      name: UBASE
      affiliation: ByteDance
      url: /publications/#ATC-26
      description: A production AI search engine for trillion-scale vector data, combining graph-index construction with hybrid memory and SSD storage.
      links:
        - label: Paper
          url: /publications/#ATC-26
          primary: true
- id: query-graph-engines
  label: Query & graph engines
  systems:
    - id: sema
      name: SEMA
      url: /publications/#VLDB-26-2
      description: A semantic query engine built on DuckDB, integrating LLM-powered operators into SQL with query optimization and adaptive execution.
      links:
        - label: Paper
          url: /publications/#VLDB-26-2
          primary: true
    - id: ges
      name: GES
      affiliation: Huawei
      url: /projects/3_ges/
      action: Explore
      description: A production graph database service combining composable architecture and factorized execution for high-concurrency interactive graph workloads.
      links:
        - label: Overview
          url: /projects/3_ges/
          primary: true
        - label: GES paper
          url: /publications/#SIGMOD-25-1
        - label: Related · RapidStore
          url: /publications/#VLDB-25
        - label: Related · Aquila
          url: /publications/#VLDB-26
    - id: tqex
      name: TQEX
      affiliation: Huawei
      url: /projects/2_tqex/
      action: Explore
      description: A tensor-based SQL query engine using tensor runtimes as a portable execution layer across heterogeneous accelerators.
      links:
        - label: Overview
          url: /projects/2_tqex/
          primary: true
        - label: TQEX(SQL) paper
          url: /publications/#SIGMOD-26-2
    - id: tgraph
      name: TGraph
      affiliation: Huawei
      url: /publications/#SIGMOD-25-2
      description: A tensor-centric graph processing framework with graph operators, compression, and out-of-memory execution across tensor runtimes and accelerator backends.
      links:
        - label: Paper
          url: /publications/#SIGMOD-25-2
          primary: true
    - id: tengraph
      name: TenGraph
      affiliation: Huawei
      url: /publications/#VLDB-24
      description: A PyTorch-based graph query engine using compact tensor representations of graph topology and batched graph-query operations.
      links:
        - label: Paper
          url: /publications/#VLDB-24
          primary: true
    - id: vora
      name: Vora
      url: /publications/#ICDE-27-2
      description: A vector-based engine for scalable GPU-accelerated subgraph query processing.
      links:
        - label: Paper
          url: /publications/#ICDE-27-2
          primary: true
- id: distributed-analytics
