# The Systems index lists concrete systems, not research-area or affiliation buckets.
# Paper links remain the source of publication status and authorship. An omitted
# affiliation makes no institutional claim. Related research is not a claim that
# separate implementations are components of a single deployed system.
- id: agents-retrieval
  label: Agents & retrieval
  systems:
    - id: autoia
      name: AutoIA
      affiliation: ByteDance
      badge: Ongoing R&D
      url: /projects/1_autoia/
      action: Explore
      description: AutoIA is a self-evolving agentic system that improves agent tools, skills, memory, and shared environments through structured, reusable IR-first evolution.
      links:
        - label: Overview
          url: /projects/1_autoia/
          primary: true
        - label: Related memory research · AdaMM
          url: /publications/#Arxiv-26-3
    - id: ubase
      name: UBASE
      affiliation: ByteDance
      badge: ATC 2026
      url: /projects/ubase/
      action: Explore
      description: Production AI search engine spanning 7,000+ clusters and 300+ PB up to nearly one trillion vectors, combining SymRaBitQ quantization-aware graph indexing with hybrid memory/SSD storage for up to 3× higher throughput and 80% less indexing memory.
      links:
        - label: Overview
          url: /projects/ubase/
          primary: true
        - label: UBASE paper
          url: /publications/#ATC-26
        - label: Related · SSD indexing
          url: /publications/#Arxiv-26-2
- id: query-graph-engines
  label: Query & graph engines
  systems:
    - id: sema
      name: SEMA
      badge: PVLDB 2026 · Project Lead
      url: /projects/sema/
      action: Explore
      description: Brings LLM reasoning into DuckDB as first-class semantic operators via SemaSQL, LLM-assisted logical optimization, and adaptive execution, achieving 2–10× faster semantic queries than three evaluated baselines.
      links:
        - label: Overview
          url: /projects/sema/
          primary: true
        - label: SEMA paper
          url: /publications/#VLDB-26-2
        - label: Benchmark · CoreSemDB
          url: /publications/#COLM-26
    - id: ges
      name: GES
      affiliation: Huawei
      badge: "SIGMOD 2025 · LDBC #1"
      url: /projects/3_ges/
      action: Explore
      description: "A production graph database supporting hundreds of billions of edges and real-time queries, with audited #1 LDBC SNB Interactive results on both benchmark tracks (2024–2025)."
      links:
        - label: Overview
          url: /projects/3_ges/
          primary: true
        - label: GES paper
          url: /publications/#SIGMOD-25-1
        - label: Related · RapidStore
          url: /publications/#VLDB-25
        - label: Related · Aquila
          url: /publications/#VLDB-26
    - id: tqex
      name: TQEX
      affiliation: Huawei
      badge: SIGMOD 2026
      url: /projects/2_tqex/
      action: Explore
      description: Accelerates SQL analytics using portable tensor execution across NVIDIA and AMD GPUs and Apple chips, with 12.2× and 22.7× speedups over DuckDB and HeavyDB on supported TPC-H SF100 queries.
      links:
        - label: Overview
          url: /projects/2_tqex/
          primary: true
        - label: TQEX(SQL) paper
          url: /publications/#SIGMOD-26-2
    - id: tgraph
      name: TGraph
      affiliation: Huawei
      badge: SIGMOD 2025
      url: /projects/2_tqex/#tgraph
      action: Explore
      description: A tensor-centric graph processing framework with graph operators, compression, and out-of-memory execution across tensor runtimes and accelerator backends.
      links:
        - label: Overview
          url: /projects/2_tqex/#tgraph
          primary: true
        - label: Paper
          url: /publications/#SIGMOD-25-2
    - id: tengraph
      name: TenGraph
      affiliation: Huawei
      badge: VLDB 2024
      url: /projects/2_tqex/#tengraph
      action: Explore
      description: A PyTorch-based graph query engine using compact tensor representations of graph topology and batched graph-query operations.
      links:
        - label: Overview
          url: /projects/2_tqex/#tengraph
          primary: true
        - label: Paper
          url: /publications/#VLDB-24
    - id: vora
      name: Vora
      badge: ICDE 2027
      url: /publications/#ICDE-27-2
      description: A vector-based GPU subgraph query engine that reformulates subgraph pattern matching into scalable vectorized GPU execution for large graphs.
      links:
        - label: Paper
          url: /publications/#ICDE-27-2
          primary: true
