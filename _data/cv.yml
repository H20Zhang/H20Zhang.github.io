          - "Spearheaded hardware-portable tensor-centric query and graph execution across NVIDIA GPUs, AMD GPUs, and Apple silicon, including [**TQEX**](/projects/2_tqex/) ([SIGMOD 2026](/publications/#SIGMOD-26-2)), [**TGraph**](/publications/#SIGMOD-25-2) (SIGMOD 2025), and [**TenGraph**](/publications/#VLDB-24) (PVLDB 2024)."

