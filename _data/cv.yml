        start_date: 2025
        highlights:
          - "Leading research and system architecture of [**AutoIA**](/projects/1_autoia/), an IR-first framework for self-evolving agent harnesses, shared context environments, and experience-driven construction."
          - "Core contributor and corresponding author on [**UBASE**](/projects/ubase/) ([ATC 2026](/publications/#ATC-26)), ByteDance's production AI search engine spanning **7,000+ clusters, 300+ PB, and nearly one trillion vectors**, alongside multimodal agent memory ([**AdaMM**](/publications/#Arxiv-26-3), [**IGMem**](/publications/#Submitted-26-IGMem))."

      - company: Huawei
